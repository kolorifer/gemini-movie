name: CI

on:
  push:
    branches:
      - main
      - "rc/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "rc/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r services/movie_intake_api/requirements.txt -r services/movie_actions_api/requirements.txt httpx python-multipart
      - name: Run notification scope suite with network audit guard
        run: PYTHONPATH=. python tests/test_movie_notification_scope.py
      - name: Run full unittest suite
        run: PYTHONPATH=. python -m unittest discover -s . -p "test_*.py" -v
      - name: Run 5-case shadow verification suite
        run: PYTHONPATH=. python scripts/run_shadow_verification.py
